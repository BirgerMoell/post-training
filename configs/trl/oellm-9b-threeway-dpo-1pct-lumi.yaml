method: dpo
backend: trl
run_name: oellm-9b-threeway-dpo-1pct
offline: true
prefetch_assets: false
container: null

model:
  name_or_path: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/model
  attn_implementation: flash_attention_2
  dtype: bfloat16
  revision: null
  tokenizer_name_or_path: null
  tokenizer_revision: null

training:
  max_steps: 10
  num_train_epochs: null
  num_training_samples: null
  num_training_tokens: null
  learning_rate: 5.0e-7
  effective_batch_size: 32
  per_device_train_batch_size: 1
  warmup_steps: 0.03
  lr_scheduler_type: cosine
  lr_scheduler_kwargs: null
  adam_beta1: 0.9
  adam_beta2: 0.999
  weight_decay: 0.0
  adam_epsilon: 1.0e-8
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
    determinism_check: default
    debug: false
    early_stop: false
  bf16: true
  seed: 42
  use_liger_kernel: false
  liger_kernel_config: null

dpo:
  beta: 0.1
  loss_type: sigmoid
  ref_model_name_or_path: null
  max_seq_length: 2048
  dataset_num_proc: 8
  precompute_ref_log_probs: false
  precompute_ref_batch_size: 1
  truncated_pair_action: drop

evaluation:
  strategy: "no"
  steps: null
  per_device_batch_size: 1
  on_start: false
  final_eval: false

checkpointing:
  save_strategy: "no"
  save_steps: 500
  save_total_limit: 1
  save_only_model: true
  inference_checkpoint_steps: null
  inference_checkpoint_path: inference_checkpoints
  save_final_model: false

data:
  chat_template: qwen3
  num_proc: 8
  seed: 42
  location: lumi
  datasets:
    - name: helpsteer3-1pct
      path: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-1pct/helpsteer3-1pct.jsonl.gz
      split: train
      locations:
        lumi: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-1pct/helpsteer3-1pct.jsonl.gz
      weight: 1.0
      transform: null
    - name: dolci-en-1pct
      path: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-1pct/dolci-en-1pct.jsonl.gz
      split: train
      locations:
        lumi: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-1pct/dolci-en-1pct.jsonl.gz
      weight: 1.0
      transform: null
    - name: ultrafeedback-1pct
      path: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-1pct/ultrafeedback-1pct.jsonl.gz
      split: train
      locations:
        lumi: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-1pct/ultrafeedback-1pct.jsonl.gz
      weight: 1.0
      transform: null
  eval_datasets: []

deepspeed: null

accelerate:
  mixed_precision: bf16
  use_deepspeed: false
  deepspeed_multinode_launcher: standard
  same_network: true
  rdzv_backend: static
  dynamo_backend: "no"

logging:
  report_to:
    - tensorboard
  wandb_project: oellm-threeway-dpo
  logging_steps: 1
  include_num_input_tokens_seen: "no"

slurm:
  partition: dev-g
  account: project_465002530
  num_nodes: 1
  gpus_per_node: 4
  cpus_per_task: 28
  mem: 480G
  wall_time: 00:30:00
  signal_time_seconds: 300
  max_failures: 1

debug:
  enabled: false
  override_existing: false

paths:
  output_base: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/outputs
  debug_base: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/debug
