method: dpo
backend: trl
run_name: oellm-9b-threeway-dpo-full-v1
offline: true
prefetch_assets: false
container: null

model:
  name_or_path: /scratch/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/model
  attn_implementation: flash_attention_2
  dtype: bfloat16
  revision: null
  tokenizer_name_or_path: null
  tokenizer_revision: null

training:
  max_steps: null
  num_train_epochs: 1.0
  num_training_samples: null
  num_training_tokens: null
  learning_rate: 5.0e-7
  effective_batch_size: 128
  per_device_train_batch_size: 1
  warmup_steps: 0.03
  lr_scheduler_type: cosine
  lr_scheduler_kwargs: null
  adam_beta1: 0.9
  adam_beta2: 0.999
  weight_decay: 0.0
  adam_epsilon: 1.0e-8
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
    determinism_check: default
    debug: false
    early_stop: false
  bf16: true
  seed: 42
  use_liger_kernel: false
  liger_kernel_config: null

dpo:
  beta: 0.1
  loss_type: sigmoid
  ref_model_name_or_path: null
  max_seq_length: 2048
  dataset_num_proc: 16
  precompute_ref_log_probs: false
  precompute_ref_batch_size: 1
  truncated_pair_action: drop

evaluation:
  strategy: "no"
  steps: null
  per_device_batch_size: 1
  on_start: false
  final_eval: true

checkpointing:
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2
  save_only_model: true
  inference_checkpoint_steps: null
  inference_checkpoint_path: inference_checkpoints
  save_final_model: true

data:
  chat_template: qwen3
  num_proc: 16
  seed: 42
  location: lumi
  datasets:
    - name: helpsteer3-full
      path: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/helpsteer3-train.jsonl.gz
      split: train
      weight: 1.0
      transform: null
      locations:
        lumi: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/helpsteer3-train.jsonl.gz
    - name: dolci-translated-full
      path: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/dolci-train.jsonl.gz
      split: train
      weight: 1.0
      transform: null
      locations:
        lumi: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/dolci-train.jsonl.gz
    - name: ultrafeedback-full
      path: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/ultrafeedback-train.jsonl.gz
      split: train
      weight: 1.0
      transform: null
      locations:
        lumi: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/ultrafeedback-train.jsonl.gz
  eval_datasets:
    - name: helpsteer3-validation
      path: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/helpsteer3-validation.jsonl.gz
      split: validation
      weight: 1.0
      transform: null
      locations:
        lumi: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/helpsteer3-validation.jsonl.gz
    - name: dolci-translated-validation
      path: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/dolci-validation.jsonl.gz
      split: validation
      weight: 1.0
      transform: null
      locations:
        lumi: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/dolci-validation.jsonl.gz
    - name: ultrafeedback-validation
      path: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/ultrafeedback-validation.jsonl.gz
      split: validation
      weight: 1.0
      transform: null
      locations:
        lumi: /flash/project_465002530/users/bmoell/helpsteer3-dpo/artifacts/data/threeway-full/ultrafeedback-validation.jsonl.gz

deepspeed: null

accelerate:
  mixed_precision: bf16
  use_deepspeed: false
  deepspeed_multinode_launcher: standard
  same_network: true
  rdzv_backend: static
  dynamo_backend: "no"

logging:
  report_to:
    - tensorboard
  wandb_project: oellm-threeway-dpo
  logging_steps: 10
  include_num_input_tokens_seen: "no"

slurm:
  partition: small-g
  account: project_465002530
  num_nodes: 4
  gpus_per_node: 8
  cpus_per_task: 56
  mem: 480G
  wall_time: 2-00:00:00
  job_name: oellm-3way-dpo-full
  signal_time_seconds: 300
  max_failures: 1

debug:
  enabled: false
  override_existing: false

paths:
  output_base: /flash/project_465002530/users/bmoell/helpsteer3-dpo/outputs
  debug_base: /flash/project_465002530/users/bmoell/helpsteer3-dpo/debug
